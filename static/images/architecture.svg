<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="940" viewBox="0 0 1160 940" role="img" aria-labelledby="title desc"><title id="title">GeoLedger 整体架构</title><desc id="desc">浏览器经 Next.js BFF 使用私有 Session HTTP；SDK 和 CLI 使用 gRPC；Application 调用独立合并核心并拥有统一存储事务。后端选择 SQLite 加 SpatiaLite 或 PostgreSQL 加 PostGIS。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a2b3"/></marker></defs><rect width="1160" height="940" rx="16" fill="#fff"/><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#101828} .label{font-size:17px;font-weight:650}.body{font-size:13px;fill:#475467}.meta{font-size:11px;fill:#667085}.orange{fill:#cc3a05}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><text x="40" y="45" class="label" text-anchor="start">GeoLedger / 整体架构</text><text x="40" y="72" class="meta" text-anchor="start">源码 0.3.0-alpha.7 · 存储格式 19 · 核对提交 5bf353c · 2026-10-29</text><rect x="40" y="104" width="330" height="98" rx="9" fill="#f8fafc" stroke="#e4e7ec"/><text x="58" y="134" class="label" text-anchor="start">Web Console</text><text x="58" y="161" class="body" text-anchor="start">浏览器 → Next.js BFF</text><text x="58" y="184" class="meta" text-anchor="start">私有 Session HTTP</text><path d="M205.0 202L205.0 235" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="415" y="104" width="330" height="98" rx="9" fill="#f8fafc" stroke="#e4e7ec"/><text x="433" y="134" class="label" text-anchor="start">CLI / SDK</text><text x="433" y="161" class="body" text-anchor="start">Rust · Go · Node.js · Python</text><text x="433" y="184" class="meta" text-anchor="start">gRPC + API Key</text><path d="M580.0 202L580.0 235" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="790" y="104" width="330" height="98" rx="9" fill="#f8fafc" stroke="#e4e7ec"/><text x="808" y="134" class="label" text-anchor="start">外部 HTTP 客户端</text><text x="808" y="161" class="body" text-anchor="start">业务系统 / 自动化工具</text><text x="808" y="184" class="meta" text-anchor="start">HTTP API + API Key</text><path d="M955.0 202L955.0 235" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="235" width="1080" height="80" rx="9" fill="#0b1220" stroke="#0b1220"/><text x="60" y="267" style="fill:#fff;font-size:19px;font-weight:650">geoledger-server / HTTP &amp; gRPC Adapters</text><text x="60" y="294" style="fill:#b4bccb;font-size:13px">传输 · 认证 · TLS / mTLS · 准入与响应预算 · 请求期限</text><path d="M420 315L420 355" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="355" width="730" height="174" rx="9" fill="#fff4ed" stroke="#f4b294"/><text x="60" y="388" class="label orange" text-anchor="start">geoledger-engine::Application</text><text x="60" y="417" class="body" text-anchor="start">项目授权 · 数据集与 Schema · 草稿版本 · 查询与差异</text><text x="60" y="444" class="body" text-anchor="start">合并编排 · 发布 · 历史恢复 · 审计</text><text x="60" y="480" class="body" text-anchor="start">事务所有者：创建事务 → 执行业务 → 编码 / 预算检查 → 唯一一次提交</text><text x="60" y="509" class="meta" text-anchor="start">所有客户端调用同一组业务规则，不在协议适配层复制实现。</text><rect x="835" y="355" width="285" height="174" rx="9" fill="#f8fafc" stroke="#e4e7ec"/><text x="853" y="388" class="label" text-anchor="start">geoledger-core</text><text x="853" y="418" class="body" text-anchor="start">Record / Cell</text><text x="853" y="444" class="body" text-anchor="start">Base · Current · Draft</text><text x="853" y="472" class="body" text-anchor="start">与数据库无关的三方合并</text><text x="853" y="507" class="meta" text-anchor="start">纯逻辑依赖，不是数据库中转层</text><path d="M770 432L835 432" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><text x="801" y="417" class="meta" text-anchor="middle">调用</text><path d="M420 529L420 567" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="567" width="1080" height="126" rx="9" fill="#f8fafc" stroke="#e4e7ec"/><text x="60" y="600" class="label" text-anchor="start">StorageBackend → RepositoryTransaction</text><text x="60" y="627" class="body mono" text-anchor="start">Credential · Project · Dataset · Workspace · Feature · History · Publication · Audit</text><text x="60" y="657" class="body" text-anchor="start">各能力共享同一连接、快照、锁、截止时间与响应预算；领域函数不能单独提交。</text><text x="60" y="680" class="meta" text-anchor="start">SQL 适配器封装连接、查询、合并暂存、回滚与后端差异。</text><path d="M300 693L300 744" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M860 693L860 744" fill="none" stroke="#98a2b3" stroke-width="1.8" marker-end="url(#arrow)"/><text x="580" y="727" class="meta" text-anchor="middle">服务端配置选择一个后端</text><rect x="40" y="744" width="520" height="113" rx="9" fill="#f8fafc" stroke="#e4e7ec"/><text x="60" y="779" class="label" text-anchor="start">SQLite + SpatiaLite</text><text x="60" y="807" class="body" text-anchor="start">WAL · 原生几何 · RTree · 独立数据集表</text><text x="60" y="835" class="meta" text-anchor="start">当前表 / 草稿 / 历史 / Schema / 回执 / 审计</text><rect x="600" y="744" width="520" height="113" rx="9" fill="#f8fafc" stroke="#e4e7ec"/><text x="620" y="779" class="label" text-anchor="start">PostgreSQL + PostGIS</text><text x="620" y="807" class="body" text-anchor="start">连接池 · 原生 geometry · GiST · 项目与工作区锁</text><text x="620" y="835" class="meta" text-anchor="start">自建正式表，或绑定已有业务表；发布同步原表</text><text x="40" y="894" class="label orange" text-anchor="start">原子发布边界</text><text x="40" y="920" class="body" text-anchor="start">正式要素 + 旧正文 + Commit / Changes + Schema History + HEAD + Workspace + Receipt + Audit</text></svg>
